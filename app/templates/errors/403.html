{% extends "base.html" %}

{% block title %}403 Forbidden - Smart Study{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-lg border-0 rounded-4 max-w-600 mx-auto p-4 p-md-5">
        <div class="mb-4 text-danger">
            <i class="bi bi-shield-lock-fill display-1"></i>
        </div>
        <h1 class="fw-bold text-dark mb-3">403 - Access Denied</h1>
        <p class="text-muted fs-5 mb-4">
            You do not have administrative permission to access this protected area. High-level administrative authorization is required.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('admin.dashboard') if current_user.is_authenticated and current_user.is_admin else url_for('student.dashboard') }}" class="btn btn-primary btn-lg px-4 rounded-3 fw-semibold">
                <i class="bi bi-house-door me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
