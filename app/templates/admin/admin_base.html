<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %} · Smart Study SaaS Management</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SaaS Admin CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="admin-body">

    <div class="admin-shell">
        <!-- Sidebar Navigation Component -->
        {% include 'admin/_sidebar.html' %}

        <!-- Main Viewport -->
        <div class="admin-viewport">
            <!-- Header Topbar Component -->
            {% include 'admin/_header.html' %}

            <!-- Toast Flash Messages Component -->
            {% include 'admin/_toast.html' %}

            <!-- Main Content Area -->
            <main class="admin-main-content">
                {% block admin_content %}
                {% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Admin Sidebar Mobile Toggle & Interactive Helpers -->
    <script>
        // ── Shared Super Admin Permanent Delete Confirmation Handler ─────────────
        function normalizeConfirmText(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/\u00A0/g, ' ')  // convert non-breaking spaces
                .replace(/\s+/g, ' ')     // collapse multiple spaces/newlines
                .trim()
                .toLowerCase();
        }

        function handleConfirmDeleteInput(inputEl) {
            if (!inputEl) return;
            const rawTarget = inputEl.getAttribute('data-target') || inputEl.dataset.target || inputEl.dataset.expected || '';
            const target = normalizeConfirmText(rawTarget);
            const val = normalizeConfirmText(inputEl.value);

            // Find nearest form and confirm submit button
            const form = inputEl.closest('form');
            let btn = null;
            if (form) {
                btn = form.querySelector('button[type="submit"]') ||
                      form.querySelector('.confirm-delete-btn, .confirm-level-btn, .confirm-uni-btn, .confirm-fac-btn, .confirm-prog-btn, .confirm-subj-btn, #confirmStudentDeleteBtn');
            }
            if (!btn && inputEl.getAttribute('data-btn-id')) {
                btn = document.getElementById(inputEl.getAttribute('data-btn-id'));
            }

            if (btn) {
                const isMatched = (val.length > 0 && val === target);
                btn.disabled = !isMatched;
                if (isMatched) {
                    btn.classList.remove('disabled');
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                    btn.style.pointerEvents = 'auto';
                } else {
                    btn.classList.add('disabled');
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'not-allowed';
                    btn.style.pointerEvents = 'none';
                }
            }
        }

        // Global Event Delegation for ALL confirmation input elements
        document.addEventListener('input', function(e) {
            if (e.target && e.target.matches && e.target.matches('.confirm-level-input, .confirm-uni-input, .confirm-fac-input, .confirm-prog-input, .confirm-subj-input, .confirm-delete-input, .confirm-student-input, #confirmStudentEmailInput')) {
                handleConfirmDeleteInput(e.target);
            }
        });

        document.addEventListener('change', function(e) {
            if (e.target && e.target.matches && e.target.matches('.confirm-level-input, .confirm-uni-input, .confirm-fac-input, .confirm-prog-input, .confirm-subj-input, .confirm-delete-input, .confirm-student-input, #confirmStudentEmailInput')) {
                handleConfirmDeleteInput(e.target);
            }
        });

        document.addEventListener('keyup', function(e) {
            if (e.target && e.target.matches && e.target.matches('.confirm-level-input, .confirm-uni-input, .confirm-fac-input, .confirm-prog-input, .confirm-subj-input, .confirm-delete-input, .confirm-student-input, #confirmStudentEmailInput')) {
                handleConfirmDeleteInput(e.target);
            }
        });

        // Reset inputs and buttons when any modal is opened
        document.addEventListener('show.bs.modal', function(e) {
            const modal = e.target;
            if (!modal) return;
            const inputEl = modal.querySelector('.confirm-level-input, .confirm-uni-input, .confirm-fac-input, .confirm-prog-input, .confirm-subj-input, .confirm-delete-input, .confirm-student-input, #confirmStudentEmailInput');
            if (inputEl) {
                inputEl.value = '';
                handleConfirmDeleteInput(inputEl);
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('adminSidebar');
            const toggleBtn = document.getElementById('adminSidebarToggle');
            
            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    sidebar.classList.toggle('show');
                });

                document.addEventListener('click', function(e) {
                    if (window.innerWidth < 992 && sidebar.classList.contains('show') && !sidebar.contains(e.target) && e.target !== toggleBtn) {
                        sidebar.classList.remove('show');
                    }
                });
            }

            // Auto-dismiss toasts after 6 seconds
            setTimeout(function() {
                const toasts = document.querySelectorAll('.admin-toast');
                toasts.forEach(t => {
                    t.style.opacity = '0';
                    t.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => t.remove(), 500);
                });
            }, 6000);

            // Initial check for any inputs already rendered
            document.querySelectorAll('.confirm-level-input, .confirm-uni-input, .confirm-fac-input, .confirm-prog-input, .confirm-subj-input, .confirm-delete-input, .confirm-student-input, #confirmStudentEmailInput').forEach(function(inputEl) {
                handleConfirmDeleteInput(inputEl);
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
